name: Desktop installers
on: [workflow_dispatch]
jobs:
  installers:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm rebuild node-pty --runtime=node
      - run: npm test
      - run: npm run postinstall
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
